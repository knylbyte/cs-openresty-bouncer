name: release-package

on:
  release:
    types: prereleased

permissions: {}

jobs:
  release-package:
    name: Upload release package
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the package as a release asset
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make the package
        env:
          BUILD_VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release version '$BUILD_VERSION'" >&2
            exit 1
          fi
          make release BUILD_VERSION="$BUILD_VERSION"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" crowdsec-openresty-bouncer.tgz --clobber
